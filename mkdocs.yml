site_name: Zsh for Mere Mortals
site_description: The Z shell taught from the first prompt up. The first-run wizard and the startup files, the completion system and how to teach it your own commands, globbing that does a finding tool's work, history shared between shells, a prompt you build yourself without a framework, and the Bash differences that bite, with the limits stated plainly.
